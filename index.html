<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find — movies and books, by what they're about</title>
<meta name="description" content="Search in plain words and find the movies and books about it, where to watch or read them, and what other members recommend.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23121110'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23ece7e0' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- The ground is dark everywhere, system setting or not: this is a page for
     reading at length in the evening, and the warm off-black it uses is the
     point of the design rather than a preference. -->
</head>
<body>

<header class="head">
  <span class="wordmark">Find</span>
  <span class="rubric">films &amp; books, by what they are about</span>
  <!-- A member is a generated handle and nothing else. The name and email
       Google returns are never read by this page. -->
  <div class="who">
    <span id="handle" hidden></span>
    <button class="btn" id="sign-in" type="button" hidden>Sign in with Google</button>
    <button class="btn" id="sign-out" type="button" hidden>Sign out</button>
  </div>
</header>

<main>
  <h1>Films and books, by what they are&nbsp;actually about.</h1>

  <form class="search" id="search-form" role="search">
    <input id="q" type="search" autocomplete="off" aria-label="What are you looking for"
           placeholder="grief · Renaissance Florence · a heist that goes wrong">
    <button type="submit">Search</button>
  </form>

  <!-- What the site does, drawn rather than explained: one sentence goes in,
       a reel and a book come out of the same subject. It is inline SVG so it
       costs no request and follows the page's two colours in either theme. -->
  <section class="how" id="how" aria-label="How it works">
    <figure data-demo="a film about a woman who leaves everything behind" tabindex="0" role="button">
      <svg viewBox="0 0 92 64" aria-label="A sentence typing itself, its subject words staying lit">
        <rect x="6" y="10" width="80" height="44" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".4"/>
        <line class="type t1" x1="16" y1="25" x2="72" y2="25" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <line class="type t2" x1="16" y1="33" x2="60" y2="33" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <line class="type t3" x1="16" y1="41" x2="44" y2="41" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <rect class="keep k1" x="30" y="22" width="14" height="6" rx="1"/>
        <rect class="keep k2" x="34" y="30" width="18" height="6" rx="1"/>
        <line class="caret" x1="46" y1="38" x2="46" y2="44" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <figcaption><b>Ask in a sentence.</b> “A film about a woman who leaves
        everything behind.” The subject words are what gets searched.</figcaption>
    </figure>
    <figure data-demo="Renaissance Florence" tabindex="0" role="button">
      <svg viewBox="0 0 92 64" aria-label="A lens moving between a shelf of books and a shelf of films">
        <rect x="8" y="14" width="30" height="40" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <line x1="14" y1="24" x2="32" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <line x1="14" y1="31" x2="28" y2="31" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".35"/>
        <rect x="54" y="14" width="30" height="40" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <circle cx="61" cy="22" r="2" fill="currentColor" opacity=".6"/>
        <circle cx="61" cy="32" r="2" fill="currentColor" opacity=".6"/>
        <circle cx="77" cy="22" r="2" fill="currentColor" opacity=".6"/>
        <circle cx="77" cy="32" r="2" fill="currentColor" opacity=".6"/>
        <g class="lens">
          <circle cx="46" cy="38" r="9" fill="var(--bg)" stroke="currentColor" stroke-width="1.8"/>
          <line x1="52" y1="44" x2="58" y2="50" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </g>
      </svg>
      <figcaption><b>Both shelves at once.</b> Films and books on the same
        subject, ranked by how well they match and how well they are rated.</figcaption>
    </figure>
    <figure data-demo="a heist that goes wrong" tabindex="0" role="button">
      <svg viewBox="0 0 92 64" aria-label="A pick being handed from one member to another">
        <rect x="10" y="16" width="22" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <rect x="60" y="16" width="22" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <rect class="pass" x="14" y="24" width="14" height="14" rx="1.5" fill="currentColor" opacity=".8"/>
        <path d="M36 31h20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".25"/>
        <path class="heart" d="M46 58c-4-3.4-8-6-8-9.6a4 4 0 0 1 7-2.4 4 4 0 0 1 7 2.4c0 3.6-4 6.2-8 9.6z" fill="currentColor"/>
      </svg>
      <figcaption><b>Then go and get it.</b> Every result links to IMDb,
        Goodreads and somewhere to watch or read it — and you can pass it on,
        anonymously, to anyone here.</figcaption>
    </figure>
  </section>

  <!-- Filters stay out of the way: one quiet row, no labels shouting. -->
  <div class="filters" id="filters">
    <select id="f-type" aria-label="Screen type">
      <option value="movie">Films</option>
      <option value="tv">TV shows</option>
    </select>
    <select id="f-len" aria-label="Length">
      <option value="">Any length</option>
      <option value="short">Under 45 min</option>
      <option value="standard">45–120 min</option>
      <option value="long">Over 2 hours</option>
    </select>
    <select id="f-lang" aria-label="Book language">
      <option value="">Any language</option>
      <option value="en">English only</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
      <option value="de">German</option>
      <option value="fa">Persian</option>
    </select>
    <select id="f-pages" aria-label="Book length">
      <option value="">Any size</option>
      <option value="short">Under 200 pp</option>
      <option value="medium">200–450 pp</option>
      <option value="long">Over 450 pp</option>
    </select>
    <label class="check"><input type="checkbox" id="f-translated"> Likely translated</label>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab on" type="button" data-tab="results">Results</button>
    <button class="tab" type="button" data-tab="ranking">Top picks</button>
    <button class="tab" type="button" data-tab="feed">Searches</button>
    <button class="tab" type="button" data-tab="forme">For you</button>
    <button class="tab" type="button" data-tab="saved">Your list</button>
  </nav>

  <p class="status" id="status"></p>

  <section id="pane-results">
    <div class="cols">
      <div><h2>Movies</h2><div class="list" id="movies"></div></div>
      <div><h2>Books</h2><div class="list" id="books"></div></div>
    </div>
  </section>

  <section id="pane-ranking" hidden>
    <h2>Top picks</h2>
    <div class="list" id="ranking"></div>
  </section>

  <section id="pane-feed" hidden>
    <h2>What people are searching</h2>
    <div class="feed" id="feed"></div>
  </section>

  <section id="pane-forme" hidden>
    <h2>Suggested to you</h2>
    <div class="list" id="forme"></div>
  </section>

  <section id="pane-saved" hidden>
    <h2>Your list</h2>
    <div class="list" id="saved"></div>
  </section>
</main>

<dialog id="suggest-dialog">
  <form method="dialog" id="suggest-form">
    <h3 id="suggest-title">Suggest</h3>
    <label>To<select id="suggest-to"></select></label>
    <label>Note<input id="suggest-note" maxlength="280" placeholder="why this one"></label>
    <div class="dialog-acts">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn" value="send" type="submit">Send</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
